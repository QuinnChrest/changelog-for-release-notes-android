name: Build

on:
  pull_request:
  push:
    branches: [main]

# The build only reads the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Each action is pinned to a commit, its tag beside it; Dependabot offers updates.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # versionCode is the commit count
          persist-credentials: false # nothing after checkout needs the token
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :kit:test :app:assembleDebug :app:lintDebug --console=plain
